name: Release (manual)

# Publishing is a deliberate human action. This workflow has a manual trigger
# only — there is no tag/push/schedule trigger, so nothing in this repository
# releases on its own. It validates the commit, builds the .vsix and (unless
# `dry_run` is turned off) creates the Codeberg release with that asset
# attached. It never commits, pushes branches, or merges; the release's own tag
# is created by the Codeberg API at the validated commit.
#
# Marketplace / Open VSX publishing stays manual (it needs publisher
# credentials) — see docs/release.md.
on:
  workflow_dispatch:
    # Forgejo's dispatch form labels each field with its `description` and never
    # shows the input name, so every description names its input: without that,
    # "dry_run" is invisible in the UI and the form looks like it has two options.
    inputs:
      tag:
        description: 'Release tag (input: tag; default: v<version from packages/forgejo-toolkit/package.json>)'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Mark the Codeberg release as a prerelease (input: prerelease)'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (input: dry_run) — build and package only, without creating the Codeberg release'
        required: false
        type: boolean
        default: true

# No `permissions:` block on purpose: Forgejo does not implement GitHub's
# permission model, ignores the field and warns about it in the run log. The
# release API calls below authenticate with the FORGEJO_TOKEN secret instead of
# the workflow token, so no scope has to be requested here.
jobs:
  release:
    runs-on: docker
    container:
      image: node:22
    timeout-minutes: 45
    env:
      # Registry and native-download mirrors are environment-specific, so they
      # come from repository variables and fall back to the upstream defaults.
      NPM_CONFIG_REGISTRY: ${{ vars.NPM_CONFIG_REGISTRY || 'https://registry.npmjs.org' }}
      npm_config_disturl: ${{ vars.NPM_DIST_URL || 'https://nodejs.org/dist' }}
      npm_config_prebuild_install_mirror: ${{ vars.NPM_PREBUILD_MIRROR || 'https://github.com/prebuild/prebuild-install/releases/download' }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Release notes are generated from the history between the previous
          # tag and HEAD, so the default shallow clone is not enough.
          fetch-depth: 0

      - name: Install pnpm
        run: npm install -g pnpm@11.18.0

      - name: Install build tools
        env:
          # Optional repository variables: point APT at closer mirrors when the
          # runner cannot reach deb.debian.org. The two suites are configured
          # separately because a mirror may serve them from different hosts or
          # paths; each value is a full base URI (bookworm's security suite lives
          # under /debian-security, and pre-bookworm lists use security.debian.org).
          DEBIAN_URI: ${{ vars.DEBIAN_URI }}
          DEBIAN_SECURITY_URI: ${{ vars.DEBIAN_SECURITY_URI }}
        run: |
          if [ -n "$DEBIAN_URI" ] || [ -n "$DEBIAN_SECURITY_URI" ]; then
            escape() { printf '%s' "$1" | sed 's/[&|]/\\&/g'; }
            DEBIAN=''
            SECURITY=''
            if [ -n "$DEBIAN_URI" ]; then DEBIAN=$(escape "$DEBIAN_URI"); fi
            if [ -n "$DEBIAN_SECURITY_URI" ]; then SECURITY=$(escape "$DEBIAN_SECURITY_URI"); fi
            for file in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources; do
              [ -f "$file" ] || continue
              cp "$file" "$file.mirror-backup"
              # The security suite is rewritten first, so the main rewrite below
              # cannot touch /debian-security lines any more.
              if [ -n "$SECURITY" ]; then
                sed -i -E \
                  -e "s|https?://deb\.debian\.org/debian-security|$SECURITY|g" \
                  -e "s|https?://security\.debian\.org/debian-security|$SECURITY|g" "$file"
              fi
              if [ -n "$DEBIAN" ]; then
                # `([^-])` keeps a still-unmirrored /debian-security line intact.
                sed -i -E \
                  -e "s|https?://deb\.debian\.org/debian([^-])|$DEBIAN\1|g" \
                  -e "s|https?://deb\.debian\.org/debian$|$DEBIAN|" "$file"
              fi
            done
            # A mirror that does not carry both suites must not fail the job:
            # restore the image's own sources and update from those.
            if ! apt-get update; then
              echo "APT update through the configured mirrors failed; restoring the image's sources"
              for backup in /etc/apt/sources.list.mirror-backup /etc/apt/sources.list.d/*.sources.mirror-backup; do
                [ -f "$backup" ] || continue
                mv "$backup" "${backup%.mirror-backup}"
              done
              apt-get update
            fi
          else
            apt-get update
          fi
          apt-get install -y --no-install-recommends build-essential python3 unzip

      - name: Setup pnpm store
        run: pnpm config set store-dir /root/.pnpm-store

      - name: Cache pnpm store and node-gyp
        uses: actions/cache@v6
        with:
          path: |
            /root/.pnpm-store
            /root/.cache/node-gyp
          key: ${{ runner.os }}-pnpm-release-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-release-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A release is only cut from a commit that validates: the same checks the
      # manual verify workflow runs, repeated here so the release does not
      # depend on someone having run it first.
      - name: Typecheck
        run: pnpm run check

      - name: Test
        run: pnpm --filter forgejo-toolkit test

      # The dispatch inputs are echoed here on purpose: `tag` and `prerelease`
      # only change what the release step creates, which is skipped in a dry run,
      # so without this an input that never arrived would look like an input that
      # had no effect.
      - name: Resolve version and tag
        id: vars
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          VERSION=$(node -p "require('./packages/forgejo-toolkit/package.json').version")
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "tag=${TAG} prerelease=${INPUT_PRERELEASE:-unset} dry_run=${INPUT_DRY_RUN:-unset}" >> $GITHUB_STEP_SUMMARY
          echo "Dispatch inputs: tag='${INPUT_TAG:-<empty>}' prerelease='${INPUT_PRERELEASE:-<empty>}' dry_run='${INPUT_DRY_RUN:-<empty>}'"
          echo "Releasing version ${VERSION} as ${TAG}"
          if [ "${INPUT_DRY_RUN}" = "true" ] || [ "${INPUT_DRY_RUN}" = "True" ]; then
            echo "Dry run: the Codeberg release step is skipped, so 'prerelease' and 'tag' only affect the log above. Uncheck 'Build and package only' to publish." >> $GITHUB_STEP_SUMMARY
          fi

      # `pnpm run package` builds the extension bundle (esbuild + webview) and
      # then runs `vsce package --no-dependencies`, which writes the .vsix into
      # the package directory (gitignored).
      - name: Build and package the extension
        run: pnpm --filter forgejo-toolkit run package

      - name: Check the packaged .vsix
        id: vsix
        run: |
          VSIX=$(ls -t packages/forgejo-toolkit/*.vsix | head -1)
          if [ -z "$VSIX" ]; then
            echo "No .vsix was produced"; exit 1
          fi
          echo "Checking ${VSIX}"
          unzip -l "$VSIX" > /tmp/vsix-contents.txt
          # Everything a distribution needs: the two bundles, the manifest, the
          # license and changelog copies the packaging step requires, plus the
          # localized l10n/walkthrough files and the webview entry point (a
          # webview build that silently stopped running would otherwise ship as a
          # .vsix that opens to an empty panel).
          for entry in \
            extension/package.json \
            extension/out/extension.js \
            extension/out/mcp-server.js \
            extension/LICENSE.txt \
            extension/CHANGELOG.md \
            extension/l10n/bundle.l10n.json \
            extension/walkthrough/addInstance.md \
            extension/out/webview/index.html; do
            grep -q "$entry" /tmp/vsix-contents.txt || { echo "MISSING: $entry"; cat /tmp/vsix-contents.txt; exit 1; }
            echo "OK: $entry"
          done
          echo "vsix=${VSIX}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: notes
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          NOTES_FILE=/tmp/release-notes.md
          # Curated notes win: the CHANGELOG.md section for this version (or
          # [Unreleased]) is what the release body should contain, so preparing
          # that section is part of the release checklist. `index(...) == 1` is a
          # prefix test on purpose — it needs no escaping for the dots and
          # brackets in the heading, and including the closing bracket keeps
          # 0.0.1 from matching a 0.0.10 section.
          extract() {
            awk -v heading="$1" '
              index($0, heading) == 1 { capture=1; next }
              capture && /^## \[/ { exit }
              capture { print }
            ' CHANGELOG.md
          }
          extract "## [${VERSION}]" > "$NOTES_FILE"
          if ! grep -q '[^[:space:]]' "$NOTES_FILE"; then
            extract '## [Unreleased]' > "$NOTES_FILE"
          fi
          if ! grep -q '[^[:space:]]' "$NOTES_FILE"; then
            echo "No CHANGELOG section for ${VERSION} or [Unreleased]; falling back to the commit log." >&2
            # `git describe` only finds tags that are ancestors, which is exactly
            # what breaks after a history rewrite; look the newest release tag up
            # by name instead, and cap the fallback so a repository without any
            # tag never dumps its whole history into the release body.
            PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
            if [ -n "$PREV_TAG" ]; then
              {
                echo "Changes since ${PREV_TAG}:"
                echo ""
                git log --no-merges --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD"
              } >> "$NOTES_FILE"
            else
              {
                echo "Recent changes (up to 40):"
                echo ""
                git log --no-merges -n 40 --pretty=format:"- %s (%h)" HEAD
              } >> "$NOTES_FILE"
            fi
            echo "" >> "$NOTES_FILE"
          fi
          echo "Release notes for ${VERSION}:"
          cat "$NOTES_FILE"

      - name: Upload the .vsix as a workflow artifact
        uses: forgejo/upload-artifact@v5
        with:
          name: forgejo-toolkit-${{ steps.vars.outputs.version }}
          path: ${{ steps.vsix.outputs.vsix }}

      - name: Create the Codeberg release and attach the .vsix
        # `inputs.dry_run` evaluates as a boolean on current Forgejo runners and
        # as a string on older ones; both spellings are accepted so publishing
        # only happens when it was explicitly turned off. Anything else —
        # including an input that never arrived — keeps the release untouched.
        if: ${{ inputs.dry_run == false || inputs.dry_run == 'false' || inputs.dry_run == 'False' }}
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN || secrets.GITEA_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.vars.outputs.tag }}
          TARGET: ${{ github.sha }}
          PRERELEASE: ${{ inputs.prerelease }}
          NOTES_FILE: /tmp/release-notes.md
          VSIX: ${{ steps.vsix.outputs.vsix }}
        run: |
          # The script goes to `node` on stdin. Node ≥ 22 refuses to guess the
          # module format for a snippet that mixes require() with top-level await
          # (ERR_AMBIGUOUS_MODULE_SYNTAX), which broke this step on the runner, so
          # everything lives in an async function and the snippet stays plain
          # CommonJS.
          node <<'NODE'
          const { readFile } = require('node:fs/promises');

          async function main() {
            const { FORGEJO_TOKEN, SERVER_URL, REPOSITORY, TAG, TARGET, PRERELEASE, NOTES_FILE, VSIX } = process.env;
            if (!FORGEJO_TOKEN) {
              console.error('The FORGEJO_TOKEN (or GITEA_TOKEN) secret is required to create a release.');
              process.exit(1);
            }
            const base = `${SERVER_URL}/api/v1/repos/${REPOSITORY}`;
            const headers = { Authorization: `token ${FORGEJO_TOKEN}`, 'Content-Type': 'application/json' };

            const created = await fetch(`${base}/releases`, {
              method: 'POST',
              headers,
              body: JSON.stringify({
                tag_name: TAG,
                // Pin the tag to the validated commit instead of the branch head,
                // which may have moved since the workflow started.
                target_commitish: TARGET,
                name: TAG,
                body: await readFile(NOTES_FILE, 'utf8'),
                draft: false,
                prerelease: PRERELEASE === 'true',
              }),
            });
            const release = await created.json().catch(() => ({}));
            if (!created.ok) {
              console.error(`Creating the release failed (HTTP ${created.status})`, release);
              process.exit(1);
            }
            console.log(`Created release ${release.id} for ${TAG}`);

            const name = VSIX.split('/').pop();
            const form = new FormData();
            form.append('attachment', new Blob([await readFile(VSIX)]), name);
            const uploaded = await fetch(`${base}/releases/${release.id}/assets?name=${encodeURIComponent(name)}`, {
              method: 'POST',
              headers: { Authorization: `token ${FORGEJO_TOKEN}` },
              body: form,
            });
            if (!uploaded.ok) {
              console.error(`Uploading ${name} failed (HTTP ${uploaded.status})`, await uploaded.text());
              process.exit(1);
            }
            console.log(`Attached ${name} to ${TAG}`);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
