name: Verify (manual)

# Manual trigger only, on purpose: this project is hosted on Codeberg, whose
# Terms of Use discourage autonomous CI agents and push-triggered pipelines.
# A human starts the run from the Actions tab (or the `forgejo` CLI) whenever a
# change needs validating; the workflow only reads the code and never commits,
# pushes, releases, merges or publishes anything.
on:
  workflow_dispatch:

# No `permissions:` block on purpose: Forgejo does not implement GitHub's
# permission model, ignores the field and warns about it in the run log. A job's
# token permissions come from the repository's Actions/integration settings.
jobs:
  verify:
    runs-on: docker
    container:
      # Node 22 LTS: the toolchain (TypeScript 6, Vite 8, Vitest 4) requires
      # Node ≥ 20.19/22.12, and the pinned pnpm (npm install -g pnpm@11.8.0
      # below) requires ≥ 22.13 — the same floor the root package.json engine
      # states, and what the local development runtime uses.
      image: node:22
    # A hung install (registry trouble, a stuck native build) must not pin the
    # runner forever.
    timeout-minutes: 30
    env:
      # Registry and native-download mirrors are environment-specific, so they
      # come from repository variables and fall back to the upstream defaults.
      # Set `NPM_CONFIG_REGISTRY` / `NPM_DIST_URL` / `NPM_PREBUILD_MIRROR` when
      # the runner cannot reach the public hosts directly. The registry is
      # exported twice on purpose: npm reads `NPM_CONFIG_REGISTRY` (the global
      # pnpm bootstrap) while pnpm 11 reads only `PNPM_CONFIG_REGISTRY`, so a
      # mirror that only sets the npm spelling would leave every `pnpm install`
      # hitting the upstream registry.
      NPM_CONFIG_REGISTRY: ${{ vars.NPM_CONFIG_REGISTRY || 'https://registry.npmjs.org' }}
      PNPM_CONFIG_REGISTRY: ${{ vars.NPM_CONFIG_REGISTRY || 'https://registry.npmjs.org' }}
      npm_config_disturl: ${{ vars.NPM_DIST_URL || 'https://nodejs.org/dist' }}
      npm_config_prebuild_install_mirror: ${{ vars.NPM_PREBUILD_MIRROR || 'https://github.com/prebuild/prebuild-install/releases/download' }}

    steps:
      - uses: actions/checkout@v7

      # The lockfile is tracked, so pin the package manager to the version it
      # was generated with instead of whatever the runner image ships. The
      # version is the root package.json's `packageManager` field — keep the two
      # in step (see docs/release.md's "Package manager pin").
      - name: Install pnpm
        run: npm install -g pnpm@11.8.0

      # Bare node images carry no compiler; native dependencies without a
      # matching prebuild (keytar is pulled in by @vscode/vsce) would otherwise
      # fall back to node-gyp and fail the install step.
      - name: Install build tools
        env:
          # Optional repository variables: point APT at closer mirrors when the
          # runner cannot reach deb.debian.org. The two suites are configured
          # separately because a mirror may serve them from different hosts or
          # paths; each value is a full base URI (bookworm's security suite lives
          # under /debian-security, and pre-bookworm lists use security.debian.org).
          DEBIAN_URI: ${{ vars.DEBIAN_URI }}
          DEBIAN_SECURITY_URI: ${{ vars.DEBIAN_SECURITY_URI }}
        run: |
          if [ -n "$DEBIAN_URI" ] || [ -n "$DEBIAN_SECURITY_URI" ]; then
            escape() { printf '%s' "$1" | sed 's/[&|]/\\&/g'; }
            DEBIAN=''
            SECURITY=''
            if [ -n "$DEBIAN_URI" ]; then DEBIAN=$(escape "$DEBIAN_URI"); fi
            if [ -n "$DEBIAN_SECURITY_URI" ]; then SECURITY=$(escape "$DEBIAN_SECURITY_URI"); fi
            for file in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources; do
              [ -f "$file" ] || continue
              cp "$file" "$file.mirror-backup"
              # The security suite is rewritten first, so the main rewrite below
              # cannot touch /debian-security lines any more.
              if [ -n "$SECURITY" ]; then
                sed -i -E \
                  -e "s|https?://deb\.debian\.org/debian-security|$SECURITY|g" \
                  -e "s|https?://security\.debian\.org/debian-security|$SECURITY|g" "$file"
              fi
              if [ -n "$DEBIAN" ]; then
                # `([^-])` keeps a still-unmirrored /debian-security line intact.
                sed -i -E \
                  -e "s|https?://deb\.debian\.org/debian([^-])|$DEBIAN\1|g" \
                  -e "s|https?://deb\.debian\.org/debian$|$DEBIAN|" "$file"
              fi
            done
            # A mirror that does not carry both suites must not fail the job:
            # restore the image's own sources and update from those.
            if ! apt-get update; then
              echo "APT update through the configured mirrors failed; restoring the image's sources"
              for backup in /etc/apt/sources.list.mirror-backup /etc/apt/sources.list.d/*.sources.mirror-backup; do
                [ -f "$backup" ] || continue
                mv "$backup" "${backup%.mirror-backup}"
              done
              apt-get update
            fi
          else
            apt-get update
          fi
          apt-get install -y --no-install-recommends build-essential python3

      - name: Setup pnpm store
        run: pnpm config set store-dir /root/.pnpm-store

      # The store is content-addressed, so one cache keyed on the lockfile
      # serves every run; node-gyp's headers cache is keyed the same way.
      - name: Cache pnpm store and node-gyp
        uses: actions/cache@v6
        with:
          path: |
            /root/.pnpm-store
            /root/.cache/node-gyp
          key: ${{ runner.os }}-pnpm-verify-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-verify-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      # Markdown is deliberately out of scope (the pre-commit hook formats only
      # js/ts/vue, and this workflow validates code rather than prose), so the
      # glob covers every hand-written source file without gating on markdown.
      - name: Format check
        run: pnpm exec oxfmt --check "**/*.{js,mjs,cjs,ts,vue}"

      - name: Typecheck
        run: pnpm run check

      # `docs/api-verification-checklist.md` has to keep up with the client: the
      # audit resolves every generated operation the client calls and fails when
      # one has no entry in the document (see its "后续维护策略" section). It needs
      # no dependencies, so it runs before the slower suites.
      - name: API checklist coverage
        run: node tools/api-audit/check.mjs

      # The tracking documents drifted once already (a history section grew inside
      # TODO.md while FEATURES.md's 已完成 filled with open work), so the rules in
      # AGENTS.md are checked instead of trusted to review.
      - name: Tracking document audit
        run: node tools/tracking-audit/check.mjs

      # Structural checks over every markdown file: a cited file must exist and a
      # cited line must fit it, links and named headings must resolve, paired
      # language files must keep the same shape, and headings must not repeat
      # among siblings or skip a level.
      - name: Documentation audit
        run: node tools/docs-audit/check.mjs

      # packages/shared has its own suite (URL helpers, the request wrapper) that the
      # toolkit configs do not include, so it is run explicitly.
      - name: Test
        run: pnpm --filter forgejo-toolkit test && pnpm --filter @cpf23333-forgejo-toolkit/shared test

      # A build failure is a release blocker, so it is validated here as well;
      # the resulting bundle is not uploaded (release artifacts belong to the
      # release process, not to git or CI storage).
      - name: Build extension bundle
        run: pnpm --filter forgejo-toolkit run build
